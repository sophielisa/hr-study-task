<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>數位適應與創新力</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #475569;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --concept-color: #0f766e;
      --attr-color: #4338ca;
      --error-color: #dc2626;
      --border-color: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      padding: 32px 24px;
      border: 1px solid #e2e8f0;
    }

    h1 {
      font-size: 1.5rem;
      margin: 0 0 16px 0;
      text-align: center;
      color: var(--text-main);
    }

    h2 {
      font-size: 1.25rem;
      margin: 0 0 12px 0;
      text-align: center;
    }

    p {
      line-height: 1.6;
      color: var(--text-muted);
      margin: 0 0 16px 0;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    input[type="text"], select {
      width: 100%;
      padding: 12px 14px;
      font-size: 1rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: #fff;
      color: var(--text-main);
      user-select: text;
      -webkit-user-select: text;
    }

    input[type="text"]:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .btn {
      display: inline-block;
      width: 100%;
      padding: 14px 20px;
      font-size: 1.05rem;
      font-weight: 600;
      color: #fff;
      background-color: var(--primary);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      transition: background-color 0.15s;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: #0f766e;
      margin-top: 12px;
    }

    .btn-secondary:hover {
      background-color: #115e59;
    }

    .hidden {
      display: none !important;
    }

    /* 測驗畫面專用配置 */
    #screen-task {
      max-width: 860px;
      height: 100vh;
      max-height: 100dvh;
      padding: 16px;
      justify-content: space-between;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .label-box {
      flex: 1;
      background: #fff;
      border: 2px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 10px;
      text-align: center;
      min-height: 88px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .key-hint {
      font-size: 0.8rem;
      color: #64748b;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .cat-title {
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .cat-concept {
      color: var(--concept-color);
    }

    .cat-attr {
      color: var(--attr-color);
    }

    .cat-or {
      font-size: 0.85rem;
      color: #64748b;
      margin: 2px 0;
    }

    .progress-info {
      text-align: center;
      font-size: 0.85rem;
      color: #64748b;
      margin-top: 6px;
    }

    /* 中央刺激物區 */
    .stimulus-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      min-height: 220px;
    }

    .stimulus-word {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: 2px;
      padding: 16px 28px;
      border-radius: 12px;
      text-align: center;
    }

    .error-mark {
      font-size: 2.8rem;
      font-weight: 800;
      color: var(--error-color);
      margin-top: 12px;
      height: 44px;
      line-height: 44px;
      visibility: hidden;
    }

    .error-mark.visible {
      visibility: visible;
    }

    /* 區段說明覆蓋層 */
    .instruction-box {
      background: #fff;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      max-width: 580px;
      width: 100%;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
    }

    .word-preview-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 16px 0 20px 0;
      text-align: left;
      font-size: 0.92rem;
    }

    .preview-col {
      background: #f1f5f9;
      padding: 10px 12px;
      border-radius: 8px;
    }

    .preview-col strong {
      display: block;
      margin-bottom: 4px;
    }

    /* 底部左右大按鈕（手機與滑鼠點擊用） */
    .touch-controls {
      display: flex;
      gap: 16px;
      padding-bottom: 8px;
    }

    .touch-btn {
      flex: 1;
      height: 76px;
      font-size: 1.2rem;
      font-weight: 700;
      border: 2px solid #94a3b8;
      border-radius: 12px;
      background-color: #ffffff;
      color: var(--text-main);
      cursor: pointer;
      touch-action: manipulation;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .touch-btn:active {
      background-color: #e2e8f0;
      transform: scale(0.99);
    }

    .touch-btn span {
      font-size: 0.8rem;
      font-weight: 500;
      color: #64748b;
      margin-top: 2px;
    }

    .status-msg {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      background: #f1f5f9;
      font-size: 0.95rem;
      text-align: center;
    }

    .status-error {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    @media (max-width: 600px) {
      .cat-title { font-size: 1rem; }
      .stimulus-word { font-size: 2rem; }
      .touch-btn { height: 84px; }
    }
  </style>
</head>
<body>

<script>
  // =========================================================================
  // 【CONFIG 設定區】所有研究參數與詞庫皆集中於此
  // =========================================================================
  const CONFIG = {
    title: "現代職場工作模式與行為反應測驗",
    categories: {
      c1: {
        name: "高齡員工",
        type: "concept",
        words: ["銀髮族", "高齡者", "中壯年", "屆退休"]
      },
      c2: {
        name: "青年員工",
        type: "concept",
        words: ["新鮮人", "年輕人", "青年族", "剛畢業"]
      },
      pos: {
        name: "高適應力",
        type: "attribute",
        words: ["靈活", "創新", "敏捷", "開明"]
      },
      neg: {
        name: "低適應力",
        type: "attribute",
        words: ["僵化", "守舊", "遲鈍", "固執"]
      }
    },
    endpoint: "https://script.google.com/macros/s/AKfycbwGditg5QOl1zINhjtnBrS8p86p-Z40C5y9y3SvlIxrANwGDXiRo7rfHCWizJG-G1Mh/exec" // 若有後端接收網址請填於此；留空則結束時提供 CSV 下載
  };
</script>

  <!-- 1. 受測者登入畫面 -->
  <div id="screen-intro" class="container">
    <div class="card">
      <h1 id="app-title"></h1>
      <p>
        歡迎參與本次測驗。在接下來的過程中，螢幕中央會依序出現不同的詞彙，請您依照螢幕上方左右兩側的類別提示，<strong>盡可能快速且正確地</strong>進行分類。
      </p>
      <p>
        • <strong>電腦作答</strong>：請將左手食指放在鍵盤 <strong>E</strong> 鍵（代表左側），右手食指放在 <strong>I</strong> 鍵（代表右側）。<br />
        • <strong>手機或平板作答</strong>：請直接點擊畫面下方的<strong>「左側」</strong>或<strong>「右側」</strong>大按鈕。
      </p>

      <div class="form-group">
        <label for="participant-id">受測者代碼</label>
        <input type="text" id="participant-id" placeholder="請輸入研究人員提供的代碼（例如：P001）" autocomplete="off" />
      </div>

      <div class="form-group">
        <label for="session-num">作答次數</label>
        <select id="session-num">
          <option value="1">第 1 次作答</option>
          <option value="2">第 2 次作答</option>
        </select>
      </div>

      <button id="btn-start" class="btn">進入測驗</button>
    </div>
  </div>

  <!-- 2. 測驗進行主畫面 -->
  <div id="screen-task" class="container hidden">
    <div>
      <div class="top-bar">
        <div class="label-box" id="left-label-box"></div>
        <div class="label-box" id="right-label-box"></div>
      </div>
      <div class="progress-info" id="block-progress">區段 1 / 7</div>
    </div>

    <div class="stimulus-area">
      <!-- 區段開始前的說明卡 -->
      <div id="block-instruction" class="instruction-box">
        <h2 id="inst-title">區段 1 說明</h2>
        <p id="inst-desc"></p>
        <div id="inst-preview" class="word-preview-grid"></div>
        <button id="btn-begin-block" class="btn">開始本區段（或按空白鍵）</button>
      </div>

      <!-- 刺激物顯示區 -->
      <div id="trial-display" class="hidden" style="text-align: center;">
        <div id="stimulus-text" class="stimulus-word"></div>
        <div id="error-indicator" class="error-mark">✕</div>
      </div>
    </div>

    <div class="touch-controls">
      <button type="button" class="touch-btn" id="btn-left">
        左側類別
        <span>鍵盤 E 鍵</span>
      </button>
      <button type="button" class="touch-btn" id="btn-right">
        右側類別
        <span>鍵盤 I 鍵</span>
      </button>
    </div>
  </div>

  <!-- 3. 測驗結束畫面 -->
  <div id="screen-end" class="container hidden">
    <div class="card" style="text-align: center;">
      <h1>作答完成</h1>
      <p style="font-size: 1.1rem; color: var(--text-main); margin-top: 12px;">
        感謝您的耐心參與與協助！您的作答紀錄已完成。
      </p>
      <div id="upload-status" class="status-msg">正在處理資料，請稍候...</div>
      <button id="btn-download-csv" class="btn btn-secondary hidden">下載 CSV 原始資料</button>
    </div>
  </div>

<script>
  (function () {
    // 初始化頁面標題
    document.title = CONFIG.title;
    document.getElementById("app-title").textContent = CONFIG.title;

    // 狀態變數
    const state = {
      id: "",
      session: 1,
      order: Math.random() < 0.5 ? 1 : 2,
      blocks: [],
      currentBlockIdx: 0,
      trialsQueue: [],
      currentTrialIdx: 0,
      trialStartTime: 0,
      firstAttemptCorrect: 1,
      isWaitingForBlockStart: true,
      isTaskFinished: false,
      rawTrials: []
    };

    function buildBlocks(order) {
      const firstIsA = (order === 1);
      return [
        {
          block: 1,
          trialsCount: 20,
          phase: "single",
          pairing: firstIsA ? "A" : "B",
          leftCats: firstIsA ? ["c1"] : ["c2"],
          rightCats: firstIsA ? ["c2"] : ["c1"]
        },
        {
          block: 2,
          trialsCount: 20,
          phase: "single",
          pairing: "",
          leftCats: ["pos"],
          rightCats: ["neg"]
        },
        {
          block: 3,
          trialsCount: 20,
          phase: "practice",
          pairing: firstIsA ? "A" : "B",
          leftCats: firstIsA ? ["c1", "pos"] : ["c2", "pos"],
          rightCats: firstIsA ? ["c2", "neg"] : ["c1", "neg"]
        },
        {
          block: 4,
          trialsCount: 40,
          phase: "test",
          pairing: firstIsA ? "A" : "B",
          leftCats: firstIsA ? ["c1", "pos"] : ["c2", "pos"],
          rightCats: firstIsA ? ["c2", "neg"] : ["c1", "neg"]
        },
        {
          block: 5,
          trialsCount: 20,
          phase: "single",
          pairing: firstIsA ? "B" : "A",
          leftCats: firstIsA ? ["c2"] : ["c1"],
          rightCats: firstIsA ? ["c1"] : ["c2"]
        },
        {
          block: 6,
          trialsCount: 20,
          phase: "practice",
          pairing: firstIsA ? "B" : "A",
          leftCats: firstIsA ? ["c2", "pos"] : ["c1", "pos"],
          rightCats: firstIsA ? ["c1", "neg"] : ["c2", "neg"]
        },
        {
          block: 7,
          trialsCount: 40,
          phase: "test",
          pairing: firstIsA ? "B" : "A",
          leftCats: firstIsA ? ["c2", "pos"] : ["c1", "pos"],
          rightCats: firstIsA ? ["c1", "neg"] : ["c2", "neg"]
        }
      ];
    }

    function generateTrialsForBlock(blockDef) {
      const allCats = [...blockDef.leftCats, ...blockDef.rightCats];
      const perCatCount = Math.floor(blockDef.trialsCount / allCats.length);
      let pool = [];

      allCats.forEach(catKey => {
        const words = CONFIG.categories[catKey].words;
        for (let i = 0; i < perCatCount; i++) {
          const word = words[i % words.length];
          const correctSide = blockDef.leftCats.includes(catKey) ? "left" : "right";
          pool.push({
            category: catKey,
            stimulus: word,
            correctSide: correctSide
          });
        }
      });

      for (let attempt = 0; attempt < 20; attempt++) {
        for (let i = pool.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [pool[i], pool[j]] = [pool[j], pool[i]];
        }
        let hasAdjacentDuplicate = false;
        for (let i = 1; i < pool.length; i++) {
          if (pool[i].stimulus === pool[i - 1].stimulus) {
            hasAdjacentDuplicate = true;
            break;
          }
        }
        if (!hasAdjacentDuplicate) break;
      }

      return pool;
    }

    function renderTopLabels(blockDef) {
      const renderSide = (catKeys, keyName) => {
        let html = `<div class="key-hint">按 ${keyName} 鍵 / 左側</div>`;
        if (keyName === "I") {
          html = `<div class="key-hint">按 ${keyName} 鍵 / 右側</div>`;
        }
        catKeys.forEach((k, idx) => {
          const cat = CONFIG.categories[k];
          const cls = cat.type === "concept" ? "cat-concept" : "cat-attr";
          if (idx > 0) html += `<div class="cat-or">或</div>`;
          html += `<div class="cat-title ${cls}">${cat.name}</div>`;
        });
        return html;
      };

      document.getElementById("left-label-box").innerHTML = renderSide(blockDef.leftCats, "E");
      document.getElementById("right-label-box").innerHTML = renderSide(blockDef.rightCats, "I");
      document.getElementById("block-progress").textContent = `區段 ${blockDef.block} / 7`;
    }

    function showBlockInstruction() {
      const blockDef = state.blocks[state.currentBlockIdx];
      state.isWaitingForBlockStart = true;
      renderTopLabels(blockDef);

      document.getElementById("trial-display").classList.add("hidden");
      document.getElementById("block-instruction").classList.remove("hidden");

      const leftNames = blockDef.leftCats.map(k => CONFIG.categories[k].name).join(" 或 ");
      const rightNames = blockDef.rightCats.map(k => CONFIG.categories[k].name).join(" 或 ");

      document.getElementById("inst-title").textContent = `第 ${blockDef.block} 區段（共 ${blockDef.trialsCount} 題）`;
      let extraNotice = "";
      if (blockDef.block === 5) {
        extraNotice = "<br><strong>請注意：本區段左右兩側的概念位置已經互換！</strong>";
      }
      document.getElementById("inst-desc").innerHTML =
        `當字詞屬於「<strong>${leftNames}</strong>」時，請按 <strong>E 鍵（或左側按鈕）</strong>；<br>` +
        `當字詞屬於「<strong>${rightNames}</strong>」時，請按 <strong>I 鍵（或右側按鈕）</strong>。${extraNotice}`;

      const buildPreviewCol = (title, catKeys) => {
        const wordsList = catKeys.map(k => {
          const c = CONFIG.categories[k];
          return `<div><strong>${c.name}：</strong>${c.words.join("、")}</div>`;
        }).join("");
        return `<div class="preview-col">${wordsList}</div>`;
      };

      document.getElementById("inst-preview").innerHTML =
        buildPreviewCol("左側", blockDef.leftCats) +
        buildPreviewCol("右側", blockDef.rightCats);
    }

    function startCurrentBlock() {
      if (!state.isWaitingForBlockStart) return;
      const blockDef = state.blocks[state.currentBlockIdx];
      state.trialsQueue = generateTrialsForBlock(blockDef);
      state.currentTrialIdx = 0;
      state.isWaitingForBlockStart = false;

      document.getElementById("block-instruction").classList.add("hidden");
      document.getElementById("trial-display").classList.remove("hidden");
      showNextStimulus();
    }

    function showNextStimulus() {
      const trialItem = state.trialsQueue[state.currentTrialIdx];
      const catInfo = CONFIG.categories[trialItem.category];
      const stimEl = document.getElementById("stimulus-text");

      stimEl.textContent = trialItem.stimulus;
      stimEl.className = "stimulus-word " + (catInfo.type === "concept" ? "cat-concept" : "cat-attr");

      document.getElementById("error-indicator").classList.remove("visible");
      state.firstAttemptCorrect = 1;
      state.trialStartTime = performance.now();
    }

    function handleResponse(side) {
      if (state.isTaskFinished || state.isWaitingForBlockStart) return;

      const blockDef = state.blocks[state.currentBlockIdx];
      const trialItem = state.trialsQueue[state.currentTrialIdx];

      if (side === trialItem.correctSide) {
        const rtMs = Math.round(performance.now() - state.trialStartTime);

        state.rawTrials.push({
          block: blockDef.block,
          pairing: blockDef.pairing,
          phase: blockDef.phase,
          trial: state.currentTrialIdx + 1,
          category: trialItem.category,
          stimulus: trialItem.stimulus,
          correct: state.firstAttemptCorrect,
          rt_ms: rtMs
        });

        state.currentTrialIdx++;
        if (state.currentTrialIdx < state.trialsQueue.length) {
          showNextStimulus();
        } else {
          state.currentBlockIdx++;
          if (state.currentBlockIdx < state.blocks.length) {
            showBlockInstruction();
          } else {
            finishExperiment();
          }
        }
      } else {
        state.firstAttemptCorrect = 0;
        document.getElementById("error-indicator").classList.add("visible");
      }
    }

    function mean(arr) {
      if (arr.length === 0) return null;
      return arr.reduce((a, b) => a + b, 0) / arr.length;
    }

    function sampleSD(arr) {
      if (arr.length < 2) return null;
      const m = mean(arr);
      const sumSq = arr.reduce((acc, val) => acc + Math.pow(val - m, 2), 0);
      return Math.sqrt(sumSq / (arr.length - 1));
    }

    function round4(val) {
      if (val === null || val === undefined || Number.isNaN(val)) return null;
      return Math.round(val * 10000) / 10000;
    }

    function calculateScore(rawTrials) {
      const targetTrials = rawTrials.filter(t => t.phase === "practice" || t.phase === "test");
      const validTrials = targetTrials.filter(t => t.rt_ms <= 10000);

      const n_trials = validTrials.length;
      const errorCount = validTrials.filter(t => t.correct === 0).length;
      const fastCount = validTrials.filter(t => t.rt_ms < 300).length;

      const error_rate = n_trials > 0 ? round4(errorCount / n_trials) : null;
      const fast_rate = n_trials > 0 ? round4(fastCount / n_trials) : null;

      const computePhaseD = (phaseName) => {
        const phaseData = validTrials.filter(t => t.phase === phaseName);
        const rtsA = phaseData.filter(t => t.pairing === "A").map(t => t.rt_ms);
        const rtsB = phaseData.filter(t => t.pairing === "B").map(t => t.rt_ms);
        const allRts = phaseData.map(t => t.rt_ms);

        const meanA = mean(rtsA);
        const meanB = mean(rtsB);
        const sdAll = sampleSD(allRts);

        if (meanA === null || meanB === null || !sdAll || sdAll === 0) return null;
        return (meanB - meanA) / sdAll;
      };

      const dPracticeRaw = computePhaseD("practice");
      const dTestRaw = computePhaseD("test");

      const D_practice = round4(dPracticeRaw);
      const D_test = round4(dTestRaw);

      let D = null;
      if (fast_rate !== null && fast_rate <= 0.10 && dPracticeRaw !== null && dTestRaw !== null) {
        D = round4((dPracticeRaw + dTestRaw) / 2);
      }

      return {
        n_trials,
        error_rate,
        fast_rate,
        D_practice,
        D_test,
        D
      };
    }

    function downloadCSV(payload) {
      const headers = [
        "id", "session", "order",
        "block", "pairing", "phase", "trial", "category", "stimulus", "correct", "rt_ms",
        "n_trials", "error_rate", "fast_rate", "D_practice", "D_test", "D"
      ];

      const escapeCSV = (val) => {
        if (val === null || val === undefined) return "";
        const str = String(val);
        if (str.includes(",") || str.includes('"') || str.includes("\n")) {
          return `"${str.replace(/"/g, '""')}"`;
        }
        return str;
      };

      const rows = [headers.join(",")];
      payload.trials.forEach(t => {
        const row = [
          payload.id,
          payload.session,
          payload.order,
          t.block,
          t.pairing,
          t.phase,
          t.trial,
          t.category,
          t.stimulus,
          t.correct,
          t.rt_ms,
          payload.score.n_trials,
          payload.score.error_rate,
          payload.score.fast_rate,
          payload.score.D_practice,
          payload.score.D_test,
          payload.score.D
        ].map(escapeCSV);
        rows.push(row.join(","));
      });

      const csvContent = "\uFEFF" + rows.join("\n");
      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `IAT_${payload.id}_S${payload.session}.csv`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    async function finishExperiment() {
      state.isTaskFinished = true;
      document.getElementById("screen-task").classList.add("hidden");
      document.getElementById("screen-end").classList.remove("hidden");

      const score = calculateScore(state.rawTrials);
      const payload = {
        id: state.id,
        session: state.session,
        order: state.order,
        trials: state.rawTrials,
        score: score
      };

      const statusEl = document.getElementById("upload-status");
      const downloadBtn = document.getElementById("btn-download-csv");
      downloadBtn.onclick = () => downloadCSV(payload);

      const endpoint = (CONFIG.endpoint || "").trim();
      if (!endpoint) {
        statusEl.textContent = "目前為離線收集模式，請點擊下方按鈕下載原始資料檔並交給研究人員。";
        downloadBtn.classList.remove("hidden");
        return;
      }

      try {
        statusEl.textContent = "正在傳送作答資料，請勿關閉視窗...";
        const response = await fetch(endpoint, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain"
          },
          body: JSON.stringify(payload)
        });

        const text = await response.text();
        if (response.ok && text.trim().toLowerCase() === "ok") {
          statusEl.textContent = "資料已成功傳送，您現在可以安心關閉此視窗。";
        } else {
          throw new Error("伺服器未回傳 ok");
        }
      } catch (err) {
        statusEl.classList.add("status-error");
        statusEl.textContent = "網路連線異常或傳送未完成，為避免資料遺失，請點擊下方按鈕下載 CSV 檔案並交給研究人員。";
        downloadBtn.classList.remove("hidden");
      }
    }

    document.getElementById("btn-start").addEventListener("click", () => {
      const idVal = document.getElementById("participant-id").value.trim();
      if (!idVal) {
        alert("請先輸入受測者代碼！");
        document.getElementById("participant-id").focus();
        return;
      }
      state.id = idVal;
      state.session = Number(document.getElementById("session-num").value);
      state.blocks = buildBlocks(state.order);

      document.getElementById("screen-intro").classList.add("hidden");
      document.getElementById("screen-task").classList.remove("hidden");
      showBlockInstruction();
    });

    document.getElementById("btn-begin-block").addEventListener("click", startCurrentBlock);

    const btnLeft = document.getElementById("btn-left");
    const btnRight = document.getElementById("btn-right");

    btnLeft.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      handleResponse("left");
    });

    btnRight.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      handleResponse("right");
    });

    document.addEventListener("keydown", (e) => {
      if (e.repeat) return;
      if (document.getElementById("screen-task").classList.contains("hidden")) return;

      if (state.isWaitingForBlockStart) {
        if (e.code === "Space" || e.key === " ") {
          e.preventDefault();
          startCurrentBlock();
        }
        return;
      }

      const key = e.key.toLowerCase();
      if (key === "e") {
        handleResponse("left");
      } else if (key === "i") {
        handleResponse("right");
      }
    });
  })();
</script>
</body>
</html>
